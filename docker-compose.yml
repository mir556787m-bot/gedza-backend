services:
  postgres:
    image: postgres:16-alpine
    container_name: gedza-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gedza
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gedza_secret}
      POSTGRES_DB: gedza
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gedza"]
      interval: 10s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gedza-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build: .
    container_name: gedza-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env.local
    environment:
      - REDIS_URL=redis://redis:6379/0
      - POSTGRES_URL=postgresql://gedza:${POSTGRES_PASSWORD:-gedza_secret}@postgres:5432/gedza
    volumes:
      - ./app:/app/app
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  redis_data:
  postgres_data:
